<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Rowing Tracker Icon Generator</h1>
    <p>This will generate all required icon sizes for the PWA.</p>
    <button onclick="generateIcons()">Generate All Icons</button>
    <div id="results"></div>

    <script>
        function generateIcons() {
            const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
            const results = document.getElementById('results');
            results.innerHTML = '<p>Generating icons...</p>';

            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Create blue-green gradient background
                const gradient = ctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, '#2196f3');
                gradient.addColorStop(1, '#4caf50');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);

                // Draw rowboat emoji (scaled)
                ctx.font = `${size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚣', size / 2, size / 2);

                // Convert to blob and download
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `icon-${size}x${size}.png`;
                    link.click();
                    URL.revokeObjectURL(url);
                });

                results.appendChild(canvas);
            });

            setTimeout(() => {
                results.innerHTML += '<p style="color: green; font-weight: bold;">✓ All icons generated! Check your Downloads folder and move them to the icons/ folder.</p>';
            }, 2000);
        }
    </script>
</body>
</html>
